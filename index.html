<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subbagian Rumah Tangga</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://lh3.googleusercontent.com/d/1qRcKADzPeAHvnT5f_Hmdy1uB5CVw6tR-" />
  <link rel="icon" type="image/png" sizes="192x192" href="https://lh3.googleusercontent.com/d/1qRcKADzPeAHvnT5f_Hmdy1uB5CVw6tR-" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/d/1qRcKADzPeAHvnT5f_Hmdy1uB5CVw6tR-" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #eee; overflow: hidden; }
    .iframe-container { width: 100%; height: 100dvh; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe id="app"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
  <script>
    var BASE = 'https://script.google.com/macros/s/AKfycbxAP0Ntzb_4JuS7IZ2clWJkknzy2mWDNde4s49yNItGVl-Su64xftm4GO7NdJj3R4VacQ/exec';
    var MAP = {
      'Kesehatan': 'kesehatan',
      'LK': 'kesehatan',
      'Perkantoran': 'perkantoran',
      'Angkutan': 'angkutan',
      'Persuratan': 'persuratan',
      'Kepegawaian': 'kepegawaian',
      'Pemberkasan': 'pemberkasan'
    };
    var p = new URLSearchParams(location.search).get('p');
    var target = BASE;
    if (p && MAP[p]) target += '#/' + MAP[p];
    document.getElementById('app').src = target;
  window.addEventListener('message', function (e) {
  if (!e.data || e.data.type !== 'rute') return;
  var path = e.data.path ? '/RT/' + e.data.path : '/RT/';
  if (location.pathname !== path) history.pushState(null, '', path);
});
  </script>
</body>
</html>
